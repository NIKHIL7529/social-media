apiVersion: v1
kind: Service
metadata:
  name: socialsphere-web
  namespace: social-media
  labels:
    app.kubernetes.io/name: socialsphere
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: socialsphere
    app.kubernetes.io/component: web
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http
