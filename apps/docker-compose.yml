services:
  api:
    image: socialsphere-api:local
    build:
      context: ./api
    container_name: socialsphere-api
    env_file:
      - ./api/.env
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      socialsphere-network:
        aliases:
          - api

  web:
    image: socialsphere-web:local
    build:
      context: ./web
      args:
        API_INTERNAL_URL: http://api:8000
    container_name: socialsphere-web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - socialsphere-network

networks:
  socialsphere-network:
