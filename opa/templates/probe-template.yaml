apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredprobe
  labels:
    app.kubernetes.io/name: socialsphere
    app.kubernetes.io/component: policy
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredProbe
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredprobe

        import rego.v1

        workload := input.review.object

        pod_spec := workload.spec if {
          workload.kind == "Pod"
        }

        pod_spec := workload.spec.jobTemplate.spec.template.spec if {
          workload.kind == "CronJob"
        }

        pod_spec := workload.spec.template.spec if {
          workload.kind != "Pod"
          workload.kind != "CronJob"
        }

        containers contains container if {
          container := pod_spec.containers[_]
        }

        containers contains container if {
          container := pod_spec.initContainers[_]
        }

        violation contains {"msg": msg} if {
          container := containers[_]
          not container.readinessProbe
          msg := sprintf("Container %s must define a readiness probe", [container.name])
        }

        violation contains {"msg": msg} if {
          container := containers[_]
          not container.livenessProbe
          msg := sprintf("Container %s must define a liveness probe", [container.name])
        }
