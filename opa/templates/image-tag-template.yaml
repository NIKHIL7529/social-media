apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredimagetag
  labels:
    app.kubernetes.io/name: socialsphere
    app.kubernetes.io/component: policy
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredImageTag
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredimagetag

        import rego.v1

        workload := input.review.object

        pod_spec := workload.spec if {
          workload.kind == "Pod"
        }

        pod_spec := workload.spec.jobTemplate.spec.template.spec if {
          workload.kind == "CronJob"
        }

        pod_spec := workload.spec.template.spec if {
          workload.kind != "Pod"
          workload.kind != "CronJob"
        }

        containers contains container if {
          container := pod_spec.containers[_]
        }

        containers contains container if {
          container := pod_spec.initContainers[_]
        }

        violation contains {"msg": msg} if {
          container := containers[_]
          not has_image_version(container.image)
          msg := sprintf("Container %s image must include an explicit tag or digest", [container.name])
        }

        violation contains {"msg": msg} if {
          container := containers[_]
          endswith(container.image, ":latest")
          msg := sprintf("Container %s image must not use the latest tag", [container.name])
        }

        has_image_version(image) if {
          contains(image, "@sha256:")
        }

        has_image_version(image) if {
          parts := split(image, "/")
          last := parts[count(parts) - 1]
          contains(last, ":")
        }
