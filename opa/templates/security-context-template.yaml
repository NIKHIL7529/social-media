apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredsecuritycontext
  labels:
    app.kubernetes.io/name: socialsphere
    app.kubernetes.io/component: policy
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredSecurityContext
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredsecuritycontext

        import rego.v1

        workload := input.review.object

        pod_spec := workload.spec if {
          workload.kind == "Pod"
        }

        pod_spec := workload.spec.jobTemplate.spec.template.spec if {
          workload.kind == "CronJob"
        }

        pod_spec := workload.spec.template.spec if {
          workload.kind != "Pod"
          workload.kind != "CronJob"
        }

        containers contains container if {
          container := pod_spec.containers[_]
        }

        containers contains container if {
          container := pod_spec.initContainers[_]
        }

        violation contains {"msg": msg} if {
          container := containers[_]
          container.securityContext.readOnlyRootFilesystem != true
          msg := sprintf("Container %s must use a read-only root filesystem", [container.name])
        }

        violation contains {"msg": msg} if {
          container := containers[_]
          not drops_all_capabilities(container)
          msg := sprintf("Container %s must drop all Linux capabilities", [container.name])
        }

        violation contains {"msg": "Pods must not use host networking"} if {
          pod_spec.hostNetwork == true
        }

        violation contains {"msg": "Pods must not use host PID namespace"} if {
          pod_spec.hostPID == true
        }

        violation contains {"msg": "Pods must not use host IPC namespace"} if {
          pod_spec.hostIPC == true
        }

        violation contains {"msg": "Pods must not mount hostPath volumes"} if {
          volume := pod_spec.volumes[_]
          volume.hostPath
        }

        drops_all_capabilities(container) if {
          container.securityContext.capabilities.drop[_] == "ALL"
        }
