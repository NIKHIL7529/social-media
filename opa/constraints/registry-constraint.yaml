apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sApprovedRegistry
metadata:
  name: approved-image-registry
  labels:
    app.kubernetes.io/name: socialsphere
    app.kubernetes.io/component: policy
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "DaemonSet", "StatefulSet"]
      - apiGroups: ["batch"]
        kinds: ["Job", "CronJob"]
  parameters:
    allowedImagePrefixes:
      - socialsphere-
      - ghcr.io/
      - registry.example.com/
